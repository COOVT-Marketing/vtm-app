<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0"
>

<title>VTM DNC Portal</title>

<link
  href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap"
  rel="stylesheet"
>

<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css"
>

<style>

:root {

  --bg:#0b0f19;

  --card:#111827;

  --card2:#1f2937;

  --border:#374151;

  --txt:#f9fafb;

  --txt2:#9ca3af;

  --txt3:#6b7280;

  --teal:#1a9e75;

  --teal-glow:rgba(26,158,117,.15);

  --green:#22c55e;

  --green-glow:rgba(34,197,94,.12);

  --red:#ef4444;

  --red-glow:rgba(239,68,68,.12);

  --yellow:#eab308;

  --yellow-glow:rgba(234,179,8,.12);

}

* {

  box-sizing:border-box;
  margin:0;
  padding:0;

}

body {

  font-family:'DM Sans',sans-serif;

  background:var(--bg);

  color:var(--txt);

  min-height:100vh;

  display:flex;

  justify-content:center;

  padding:30px 15px;

}

.card {

  width:100%;

  max-width:650px;

  background:var(--card);

  border:1px solid var(--border);

  border-radius:18px;

  overflow:hidden;

  box-shadow:0 25px 60px rgba(0,0,0,.55);

}

.header {

  background:#090d16;

  padding:20px;

  display:flex;

  align-items:center;

  gap:12px;

  border-bottom:1px solid var(--border);

}

.logo {

  width:42px;

  height:42px;

  background:var(--teal);

  border-radius:11px;

  display:flex;

  align-items:center;

  justify-content:center;

}

.logo i {

  font-size:23px;

}

.header-text h1 {

  font-size:17px;

  font-weight:600;

}

.header-text p {

  font-size:12px;

  color:var(--txt2);

  margin-top:2px;

}

.badge-company {

  margin-left:auto;

  padding:5px 11px;

  border-radius:20px;

  background:var(--teal-glow);

  color:var(--teal);

  font-size:12px;

  border:1px solid rgba(26,158,117,.35);

}

.body {

  padding:22px;

}

.section {

  margin-bottom:25px;

}

.section-title {

  display:flex;

  align-items:center;

  gap:8px;

  font-size:15px;

  font-weight:600;

  margin-bottom:6px;

}

.section-title i {

  color:var(--teal);

  font-size:19px;

}

.description {

  color:var(--txt3);

  font-size:12px;

  line-height:1.5;

  margin-bottom:14px;

}

.input-row {

  display:flex;

  gap:10px;

}

input {

  width:100%;

  background:#090d16;

  border:1px solid var(--border);

  border-radius:10px;

  color:white;

  padding:13px 14px;

  font-size:14px;

  outline:none;

}

input:focus {

  border-color:var(--teal);

}

button {

  border:0;

  border-radius:10px;

  padding:13px 16px;

  background:var(--teal);

  color:white;

  font-size:14px;

  font-weight:500;

  cursor:pointer;

}

button:disabled {

  opacity:.5;

  cursor:not-allowed;

}

.phone-row {

  display:flex;

  gap:10px;

}

.phone-row button {

  white-space:nowrap;

}

.divider {

  height:1px;

  background:var(--border);

  margin:28px 0;

}

.name-grid {

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:10px;

  margin-bottom:10px;

}

.search-btn {

  width:100%;

  display:flex;

  justify-content:center;

  align-items:center;

  gap:8px;

}

.result {

  display:none;

  margin-top:15px;

  border:1px solid var(--border);

  border-radius:14px;

  overflow:hidden;

  background:var(--card2);

}

.result.show {

  display:block;

}

.result-header {

  padding:15px 17px;

  border-bottom:1px solid var(--border);

  display:flex;

  align-items:center;

  gap:10px;

}

.result-header i {

  font-size:21px;

}

.result-title {

  font-size:14px;

  font-weight:600;

}

.result-sub {

  font-size:11px;

  color:var(--txt2);

  margin-top:3px;

}

.loading {

  border-color:rgba(26,158,117,.45);

}

.loading .result-header i {

  color:var(--teal);

  animation:spin .8s linear infinite;

}

.success {

  border-color:rgba(34,197,94,.4);

}

.success .result-header i {

  color:var(--green);

}

.warning {

  border-color:rgba(234,179,8,.45);

}

.warning .result-header i {

  color:var(--yellow);

}

.danger {

  border-color:rgba(239,68,68,.55);

}

.danger .result-header i {

  color:var(--red);

}

.result-body {

  padding:15px;

}

.validation-box {

  padding:13px;

  border-radius:10px;

  margin-bottom:14px;

  font-size:12px;

  line-height:1.5;

}

.validation-box.green {

  background:var(--green-glow);

  color:var(--green);

}

.validation-box.yellow {

  background:var(--yellow-glow);

  color:#facc15;

}

.validation-box.red {

  background:var(--red-glow);

  color:#f87171;

}

.case {

  padding:15px;

  border-bottom:1px solid rgba(255,255,255,.06);

}

.case:last-child {

  border-bottom:0;

}

.case.tcpa {

  border-left:4px solid var(--red);

  background:rgba(239,68,68,.06);

}

.case-name {

  font-size:14px;

  font-weight:600;

  line-height:1.4;

  margin-bottom:10px;

}

.tcpa-label {

  display:inline-flex;

  align-items:center;

  gap:5px;

  padding:4px 9px;

  border-radius:20px;

  background:rgba(239,68,68,.15);

  color:#f87171;

  font-size:10px;

  font-weight:700;

  margin-bottom:10px;

}

.meta {

  display:grid;

  grid-template-columns:105px 1fr;

  gap:7px 10px;

}

.label {

  color:var(--txt3);

  font-size:10px;

  text-transform:uppercase;

}

.value {

  color:var(--txt2);

  font-size:12px;

  word-break:break-word;

}

.exact {

  color:var(--green);

}

.possible {

  color:#facc15;

}

.case-link {

  display:inline-flex;

  align-items:center;

  gap:5px;

  color:var(--teal);

  font-size:12px;

  text-decoration:none;

  margin-top:11px;

}

.case-link:hover {

  text-decoration:underline;

}

.empty {

  padding:20px;

  text-align:center;

}

.empty i {

  display:block;

  font-size:30px;

  margin-bottom:8px;

}

.empty-title {

  font-size:14px;

  font-weight:600;

}

.empty-text {

  color:var(--txt3);

  font-size:12px;

  line-height:1.5;

  margin-top:5px;

}

.phone-result {

  margin-top:12px;

}

.kv {

  display:grid;

  grid-template-columns:110px 1fr;

  gap:8px;

  padding:10px 14px;

  border-bottom:1px solid rgba(255,255,255,.05);

}

.kv:last-child {

  border-bottom:0;

}

.k {

  color:var(--txt3);

  font-size:10px;

  text-transform:uppercase;

}

.v {

  font-size:12px;

  color:var(--txt2);

  word-break:break-word;

}

.good {

  color:var(--green);

}

.bad {

  color:var(--red);

}

.notice {

  margin-top:14px;

  padding:11px;

  border-radius:9px;

  background:var(--yellow-glow);

  color:#facc15;

  font-size:11px;

  line-height:1.5;

}

@keyframes spin {

  to {
    transform:rotate(360deg);
  }

}

@media(max-width:520px) {

  .name-grid {

    grid-template-columns:1fr;

  }

  .phone-row {

    flex-direction:column;

  }

  .meta {

    grid-template-columns:1fr;

    gap:3px;

  }

  .kv {

    grid-template-columns:1fr;

    gap:3px;

  }

  .badge-company {

    display:none;

  }

}

</style>

</head>

<body>

<div class="card">

  <div class="header">

    <div class="logo">
      <i class="ti ti-shield-check"></i>
    </div>

    <div class="header-text">

      <h1>DNC Checker</h1>

      <p>Vocal Tech Marketing · Compliance Portal</p>

    </div>

    <div
      class="badge-company"
      id="companyBadge"
    ></div>

  </div>

  <div class="body">

    <!-- =====================================================
         PHONE CHECK
         ===================================================== -->

    <div class="section">

      <div class="section-title">

        <i class="ti ti-phone"></i>

        Phone / DNC Check

      </div>

      <div class="description">

        Check the phone number through the existing DNC lookup.

      </div>

      <div class="phone-row">

        <input
          id="phoneNumber"
          type="tel"
          placeholder="Enter phone number..."
          autocomplete="off"
        >

        <button
          id="phoneBtn"
          onclick="checkPhone()"
        >

          <i class="ti ti-search"></i>
          Check

        </button>

      </div>

      <div
        id="phoneResult"
        class="result phone-result"
      ></div>

    </div>


    <div class="divider"></div>


    <!-- =====================================================
         TCPA NAME SEARCH
         ===================================================== -->

    <div class="section">

      <div class="section-title">

        <i class="ti ti-gavel"></i>

        TCPA Name Search

      </div>

      <div class="description">

        First validates the entered name, then searches
        public federal legal records for matching cases.

      </div>

      <div class="name-grid">

        <input
          id="firstName"
          type="text"
          placeholder="First name"
          autocomplete="off"
        >

        <input
          id="lastName"
          type="text"
          placeholder="Last name"
          autocomplete="off"
        >

      </div>

      <button
        id="nameBtn"
        class="search-btn"
        onclick="searchName()"
      >

        <i class="ti ti-search"></i>

        Search Legal Records

      </button>


      <div
        id="nameResult"
        class="result"
      ></div>

    </div>

  </div>

</div>


<script>


// ============================================================
// CONFIG
// ============================================================

// EXISTING PHONE WORKER
const PHONE_WORKER =
  'https://dnc-portal.syedshayanabbasr15121472.workers.dev';

// NEW TCPA NAME WORKER
const TCPA_WORKER =
  'https://vtm-tcpa-search.syedshayanabbasr15121472.workers.dev';


// ============================================================
// COMPANY ACCESS
// ============================================================

const params =
  new URLSearchParams(
    window.location.search
  );

const company =
  (
    params.get('company') ||
    ''
  ).trim();

const allowed =
  ['echolink','vtm'];

if (
  !allowed.includes(
    company.toLowerCase()
  )
) {

  document.body.innerHTML = `

    <div style="
      color:#f9fafb;
      text-align:center;
      font-family:DM Sans,sans-serif;
      padding:80px 20px;
    ">

      <h2>Access Restricted</h2>

      <p style="
        color:#6b7280;
        margin-top:8px;
      ">

        This portal requires an authorized
        company link.

      </p>

    </div>

  `;

  throw new Error(
    'Access blocked'
  );

}

document.getElementById(
  'companyBadge'
).textContent =
  company;


// ============================================================
// PHONE CHECK
// ============================================================

async function checkPhone() {

  const input =
    document.getElementById(
      'phoneNumber'
    );

  const btn =
    document.getElementById(
      'phoneBtn'
    );

  const box =
    document.getElementById(
      'phoneResult'
    );

  const phone =
    input.value.trim()
      .replace(/\D/g,'');

  if (
    phone.length < 7 ||
    phone.length > 15
  ) {

    alert(
      'Please enter a valid phone number.'
    );

    return;

  }

  btn.disabled = true;

  box.className =
    'result show loading';

  box.innerHTML = `

    <div class="result-header">

      <i class="ti ti-loader-2"></i>

      <div>

        <div class="result-title">
          Checking phone…
        </div>

        <div class="result-sub">
          ${escapeHtml(phone)}
        </div>

      </div>

    </div>

  `;

  try {

    const response =
      await fetch(
        `${PHONE_WORKER}?phone=${encodeURIComponent(phone)}`
      );

    if (!response.ok) {

      throw new Error(
        `Phone Worker HTTP ${response.status}`
      );

    }

    const data =
      await response.json();

    const status =
      String(
        data.status || ''
      );

    const message =
      String(
        data.message || ''
      );

    box.className =
      'result show success';

    box.innerHTML = `

      <div class="result-header">

        <i class="ti ti-circle-check"></i>

        <div>

          <div class="result-title">
            Phone Lookup Complete
          </div>

          <div class="result-sub">
            ${escapeHtml(phone)}
          </div>

        </div>

      </div>

      <div class="result-body">

        <div class="kv">

          <div class="k">Status</div>

          <div class="v">
            ${escapeHtml(status || '—')}
          </div>

        </div>

        <div class="kv">

          <div class="k">Message</div>

          <div class="v">
            ${escapeHtml(message || '—')}
          </div>

        </div>

        <div class="kv">

          <div class="k">Code</div>

          <div class="v">
            ${escapeHtml(data.code || '—')}
          </div>

        </div>

        <div class="kv">

          <div class="k">Phone</div>

          <div class="v">
            ${escapeHtml(data.phone || phone)}
          </div>

        </div>

      </div>

    `;

  }

  catch(error) {

    box.className =
      'result show danger';

    box.innerHTML = `

      <div class="result-header">

        <i class="ti ti-alert-triangle"></i>

        <div>

          <div class="result-title">
            Phone Lookup Failed
          </div>

          <div class="result-sub">
            ${escapeHtml(error.message)}
          </div>

        </div>

      </div>

    `;

  }

  finally {

    btn.disabled = false;

  }

}


// ============================================================
// NAME SEARCH
// ============================================================

async function searchName() {

  const first =
    document.getElementById(
      'firstName'
    ).value.trim();

  const last =
    document.getElementById(
      'lastName'
    ).value.trim();

  const btn =
    document.getElementById(
      'nameBtn'
    );

  const box =
    document.getElementById(
      'nameResult'
    );

  if (!first || !last) {

    alert(
      'Please enter both first and last name.'
    );

    return;

  }

  if (
    TCPA_WORKER.includes(
      'PASTE-YOUR'
    )
  ) {

    alert(
      'Please add your TCPA Worker URL in the HTML CONFIG section.'
    );

    return;

  }

  btn.disabled = true;

  box.className =
    'result show loading';

  box.innerHTML = `

    <div class="result-header">

      <i class="ti ti-loader-2"></i>

      <div>

        <div class="result-title">
          Validating name…
        </div>

        <div class="result-sub">
          ${escapeHtml(first + ' ' + last)}
        </div>

      </div>

    </div>

  `;

  try {

    const endpoint =
      `${TCPA_WORKER}` +
      `?firstName=${encodeURIComponent(first)}` +
      `&lastName=${encodeURIComponent(last)}`;

    const response =
      await fetch(endpoint);

    if (!response.ok) {

      throw new Error(
        `TCPA Worker HTTP ${response.status}`
      );

    }

    const data =
      await response.json();

    renderNameResult(
      data,
      first,
      last
    );

  }

  catch(error) {

    box.className =
      'result show danger';

    box.innerHTML = `

      <div class="result-header">

        <i class="ti ti-alert-triangle"></i>

        <div>

          <div class="result-title">
            Search Failed
          </div>

          <div class="result-sub">
            ${escapeHtml(error.message)}
          </div>

        </div>

      </div>

      <div class="result-body">

        <div class="validation-box red">

          The legal-record Worker could not complete
          the search. Check the Worker URL, deployment
          and CourtListener token.

        </div>

      </div>

    `;

  }

  finally {

    btn.disabled = false;

  }

}


// ============================================================
// RENDER NAME RESULT
// ============================================================

function renderNameResult(
  data,
  first,
  last
) {

  const box =
    document.getElementById(
      'nameResult'
    );

  const name =
    data.searchedName ||
    `${first} ${last}`;

  // ----------------------------------------------------------
  // Suspicious
  // ----------------------------------------------------------

  if (
    data.validation?.status ===
    'suspicious'
  ) {

    const reasons =
      Array.isArray(
        data.validation.reasons
      )
        ? data.validation.reasons
        : [];

    box.className =
      'result show warning';

    box.innerHTML = `

      <div class="result-header">

        <i class="ti ti-alert-triangle"></i>

        <div>

          <div class="result-title">
            Suspicious Name
          </div>

          <div class="result-sub">
            ${escapeHtml(name)}
          </div>

        </div>

      </div>

      <div class="result-body">

        <div class="validation-box yellow">

          <strong>
            Name Validation: SUSPICIOUS
          </strong>

          <br><br>

          ${reasons
            .map(
              r => '• ' +
                escapeHtml(r)
            )
            .join('<br>')}

          <br><br>

          Legal-record search was not performed.

        </div>

      </div>

    `;

    return;

  }


  // ----------------------------------------------------------
  // Validated but no records
  // ----------------------------------------------------------

  const results =
    Array.isArray(
      data.results
    )
      ? data.results
      : [];

  const summary =
    data.summary || {};

  if (
    results.length === 0
  ) {

    box.className =
      'result show success';

    box.innerHTML = `

      <div class="result-header">

        <i class="ti ti-circle-check"></i>

        <div>

          <div class="result-title">
            No Matching Legal Records Found
          </div>

          <div class="result-sub">
            ${escapeHtml(name)}
          </div>

        </div>

      </div>

      <div class="result-body">

        <div class="validation-box green">

          <strong>
            Name Validation Passed
          </strong>

          <br><br>

          No sufficient matching public
          legal record was returned from
          the searched source.

        </div>

        <div class="notice">

          This does not prove that the person has
          never been involved in litigation.
          Public-record coverage and name-only
          matching are not complete identity verification.

        </div>

      </div>

    `;

    return;

  }


  // ----------------------------------------------------------
  // Determine overall status
  // ----------------------------------------------------------

  const hasTCPA =
    summary.tcpaFound === true ||
    summary.tcpaCases > 0;

  box.className =
    hasTCPA
      ? 'result show danger'
      : 'result show success';


  let html = `

    <div class="result-header">

      <i class="${
        hasTCPA
          ? 'ti ti-alert-circle'
          : 'ti ti-circle-check'
      }"></i>

      <div>

        <div class="result-title">

          ${
            hasTCPA
              ? 'TCPA CASE FOUND'
              : 'Legal Records Found'
          }

        </div>

        <div class="result-sub">

          ${escapeHtml(name)}

          ·

          ${summary.totalCases || results.length}
          record(s)

        </div>

      </div>

    </div>

    <div class="result-body">

  `;


  // ----------------------------------------------------------
  // Validation summary
  // ----------------------------------------------------------

  if (
    data.validation?.status ===
    'strong-match'
  ) {

    html += `

      <div class="validation-box green">

        <strong>
          ✓ Strong Public-Record Match
        </strong>

        <br>

        The searched name matched a party
        name in the returned legal record.

      </div>

    `;

  }

  else {

    html += `

      <div class="validation-box yellow">

        <strong>
          ⚠ Possible Public-Record Match
        </strong>

        <br>

        Review the state, court, case details
        and party information before treating
        this as the same individual.

      </div>

    `;

  }


  // ----------------------------------------------------------
  // Cases
  // ----------------------------------------------------------

  results.forEach(
    (item) => {

      html += renderCase(item);

    }
  );


  html += `

      <div class="notice">

        <strong>Important:</strong>
        A name match alone does not establish
        identity. Verify the party, state, court,
        dates and other identifying information.
        TCPA status is based on the legal-record
        information returned by the searched source.

      </div>

    </div>

  `;


  box.innerHTML =
    html;

}


// ============================================================
// CASE RENDER
// ============================================================

function renderCase(
  item
) {

  const isTCPA =
    item.isTCPA === true;

  const role =
    item.role ||
    'Unknown';

  const matchClass =
    item.exactNameMatch
      ? 'exact'
      : 'possible';

  const matchText =
    item.exactNameMatch
      ? 'Exact party-name match'
      : 'Possible name match';

  let html = `

    <div class="case ${
      isTCPA ? 'tcpa' : ''
    }">

  `;


  if (isTCPA) {

    html += `

      <div class="tcpa-label">

        <i class="ti ti-gavel"></i>

        TCPA CASE

      </div>

    `;

  }


  html += `

      <div class="case-name">

        ${escapeHtml(
          item.caseName ||
          'Case name unavailable'
        )}

      </div>

      <div class="meta">

        <div class="label">
          Match
        </div>

        <div class="value ${matchClass}">
          ${escapeHtml(matchText)}
        </div>

        <div class="label">
          Role
        </div>

        <div class="value">
          ${escapeHtml(role)}
        </div>

        <div class="label">
          State
        </div>

        <div class="value">
          ${escapeHtml(
            item.state ||
            'Not available'
          )}
        </div>

        <div class="label">
          Court
        </div>

        <div class="value">
          ${escapeHtml(
            item.court ||
            'Not available'
          )}
        </div>

        <div class="label">
          Case No.
        </div>

        <div class="value">
          ${escapeHtml(
            item.docket ||
            'Not available'
          )}
        </div>

        <div class="label">
          Filed
        </div>

        <div class="value">
          ${escapeHtml(
            item.dateFiled ||
            'Not available'
          )}
        </div>

        <div class="label">
          Status
        </div>

        <div class="value">
          ${escapeHtml(
            item.status ||
            'Not available'
          )}
        </div>

        <div class="label">
          TCPA
        </div>

        <div class="value ${
          isTCPA
            ? 'bad'
            : ''
        }">

          ${
            isTCPA
              ? 'YES'
              : 'NO'
          }

        </div>

      </div>

  `;


  if (
    item.url
  ) {

    html += `

      <a
        class="case-link"
        href="${escapeAttribute(item.url)}"
        target="_blank"
        rel="noopener noreferrer"
      >

        <i class="ti ti-external-link"></i>

        View Public Record

      </a>

    `;

  }


  if (
    item.snippet
  ) {

    html += `

      <div
        style="
          margin-top:10px;
          color:#6b7280;
          font-size:11px;
          line-height:1.5;
        "
      >

        ${escapeHtml(item.snippet)}

      </div>

    `;

  }


  html += `

    </div>

  `;

  return html;

}


// ============================================================
// SECURITY HELPERS
// ============================================================

function escapeHtml(
  value
) {

  return String(value ?? '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');

}


function escapeAttribute(
  value
) {

  return escapeHtml(value)
    .replace(/`/g,'&#096;');

}


// ============================================================
// ENTER KEY
// ============================================================

document
  .getElementById('firstName')
  .addEventListener(
    'keydown',
    function(e) {

      if (
        e.key === 'Enter'
      ) {

        searchName();

      }

    }
  );


document
  .getElementById('lastName')
  .addEventListener(
    'keydown',
    function(e) {

      if (
        e.key === 'Enter'
      ) {

        searchName();

      }

    }
  );

</script>
