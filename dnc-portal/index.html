<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>VTM DNC Portal</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">

<style>
:root {
  --bg:#0b0f19;
  --card:#111827;
  --card2:#1f2937;
  --border:#374151;
  --txt:#f9fafb;
  --txt2:#9ca3af;
  --txt3:#6b7280;
  --teal:#1a9e75;
  --teal-glow:rgba(26,158,117,.15);
  --green:#22c55e;
  --green-glow:rgba(34,197,94,.12);
  --red:#ef4444;
  --red-glow:rgba(239,68,68,.12);
  --yellow:#eab308;
  --yellow-glow:rgba(234,179,8,.12);
}

* { box-sizing:border-box; margin:0; padding:0; }

body {
  font-family:'DM Sans',sans-serif;
  background:var(--bg);
  color:var(--txt);
  min-height:100vh;
  display:flex;
  justify-content:center;
  padding:30px 15px;
}

.card {
  width:100%;
  max-width:560px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 25px 60px rgba(0,0,0,.55);
}

.header {
  background:#090d16;
  padding:20px;
  display:flex;
  align-items:center;
  gap:12px;
  border-bottom:1px solid var(--border);
}

.logo {
  width:42px;
  height:42px;
  background:var(--teal);
  border-radius:11px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.logo i { font-size:23px; }

.header-text h1 { font-size:17px; font-weight:600; }

.header-text p { font-size:12px; color:var(--txt2); margin-top:2px; }

.badge-company {
  margin-left:auto;
  padding:5px 11px;
  border-radius:20px;
  background:var(--teal-glow);
  color:var(--teal);
  font-size:12px;
  border:1px solid rgba(26,158,117,.35);
  text-transform: uppercase;
}

.body { padding:18px 22px 22px; }

.section-title {
  display:flex;
  align-items:center;
  gap:7px;
  font-size:13px;
  font-weight:600;
  color:var(--txt2);
  margin-bottom:10px;
}

.section-title i { color:var(--teal); font-size:15px; }

.phone-row { display:flex; gap:10px; }

input {
  width:100%;
  background:#090d16;
  border:1px solid var(--border);
  border-radius:10px;
  color:white;
  padding:13px 14px;
  font-size:14px;
  outline:none;
}

input:focus { border-color:var(--teal); }

button {
  border:0;
  border-radius:10px;
  padding:13px 16px;
  background:var(--teal);
  color:white;
  font-size:14px;
  font-weight:500;
  cursor:pointer;
  white-space:nowrap;
  display:flex;
  align-items:center;
  gap:8px;
}

button:disabled { opacity:.5; cursor:not-allowed; }

.result {
  display:none;
  margin-top:0;
  border:1px solid var(--border);
  border-radius:14px;
  overflow:hidden;
  background:var(--card2);
  max-height:0;
  opacity:0;
  transition:max-height .35s ease, opacity .3s ease, margin-top .35s ease;
}

.result.show { display:block; }

.result.expanded { opacity:1; margin-top:15px; }

.result-header {
  padding:15px 17px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  gap:10px;
}

.result-header i { font-size:21px; }

.result-title { font-size:14px; font-weight:600; }

.result-sub { font-size:11px; color:var(--txt2); margin-top:3px; }

.loading { border-color:rgba(26,158,117,.45); }
.loading .result-header i { color:var(--teal); animation:spin .8s linear infinite; }

.success { border-color:rgba(34,197,94,.4); }
.success .result-header i { color:var(--green); }

.danger { border-color:rgba(239,68,68,.55); }
.danger .result-header i { color:var(--red); }

.result-body { padding:6px 0; }

.kv {
  display:grid;
  grid-template-columns:130px 1fr;
  gap:8px;
  padding:11px 17px;
  border-bottom:1px solid rgba(255,255,255,.05);
}

.kv:last-child { border-bottom:0; }

.k {
  color:var(--txt3);
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.03em;
  padding-top:1px;
}

.v {
  font-size:12.5px;
  color:var(--txt2);
  word-break:break-word;
  font-family:'DM Mono',monospace;
}

.v.mono-json {
  white-space:pre-wrap;
  font-size:11px;
  line-height:1.5;
}

@keyframes spin { to { transform:rotate(360deg); } }

@media(max-width:520px) {
  .phone-row { flex-direction:column; }
  .kv { grid-template-columns:1fr; gap:3px; }
  .badge-company { display:none; }
}
</style>
</head>

<body>

<div class="card">

  <div class="header">
    <div class="logo"><i class="ti ti-shield-check"></i></div>
    <div class="header-text">
      <h1>DNC Checker</h1>
      <p>Vocal Tech Marketing &middot; Compliance Portal</p>
    </div>
    <div class="badge-company" id="companyBadge"></div>
  </div>

  <div class="body">

    <div class="section-title">
      <i class="ti ti-phone"></i>
      Enter a number to check DNC / compliance status
    </div>

    <div class="phone-row">
      <input id="phoneNumber" type="tel" placeholder="Enter phone number..." autocomplete="off">
      <button id="phoneBtn" onclick="checkPhone()">
        <i class="ti ti-search"></i>
        Check
      </button>
    </div>

    <div id="phoneResult" class="result"></div>

  </div>

</div>

<script>
const PHONE_WORKER = 'https://dnc-portal.syedshayanabbasr15121472.workers.dev';
const SHEET_LOGGER_URL = 'https://script.google.com/macros/s/AKfycby8j6erDfX9E6j8Y03uv4JdLzLykAYY4dzvYJRj94QEl4LBBSR0uc2THu_sTXg97n5wIw/exec';

// Company Access Guard
const params = new URLSearchParams(window.location.search);
const company = (params.get('company') || '').trim();
const allowed = ['echolink', 'vtm'];

if (!allowed.includes(company.toLowerCase())) {
  document.body.innerHTML = `
    <div style="color:#f9fafb;text-align:center;font-family:'DM Sans',sans-serif;padding:80px 20px;">
      <h2>Access Restricted</h2>
      <p style="color:#6b7280;margin-top:8px;">This portal requires an authorized company link.</p>
    </div>
  `;
  throw new Error('Access blocked');
}

document.getElementById('companyBadge').textContent = company;

// Phone Check
async function checkPhone() {
  const input = document.getElementById('phoneNumber');
  const btn = document.getElementById('phoneBtn');
  const box = document.getElementById('phoneResult');

  const rawInput = input.value.trim();
  const phone = rawInput.replace(/\D/g, '');

  if (phone.length < 7 || phone.length > 15) {
    alert('Please enter a valid phone number.');
    return;
  }

  btn.disabled = true;

  setResult(box, 'loading', `
    <div class="result-header">
      <i class="ti ti-loader-2"></i>
      <div>
        <div class="result-title">Checking phone&hellip;</div>
        <div class="result-sub">${escapeHtml(phone)}</div>
      </div>
    </div>
  `);

  let data = null;

  try {
    const response = await fetch(`${PHONE_WORKER}?phone=${encodeURIComponent(phone)}`);
    if (!response.ok) throw new Error(`Phone Worker HTTP ${response.status}`);

    data = await response.json();

    setResult(box, 'success', `
      <div class="result-header">
        <i class="ti ti-circle-check"></i>
        <div>
          <div class="result-title">Phone Lookup Complete</div>
          <div class="result-sub">${escapeHtml(phone)}</div>
        </div>
      </div>
      <div class="result-body">
        ${renderRawKv(data)}
      </div>
    `);
  } catch (error) {
    setResult(box, 'danger', `
      <div class="result-header">
        <i class="ti ti-alert-triangle"></i>
        <div>
          <div class="result-title">Phone Lookup Failed</div>
          <div class="result-sub">${escapeHtml(error.message)}</div>
        </div>
      </div>
    `);
  } finally {
    btn.disabled = false;
  }

  if (data) {
    logToSheet(phone, data);
  }
}

function setResult(box, statusClass, html) {
  box.className = `result show ${statusClass}`;
  box.innerHTML = html;

  box.style.maxHeight = box.classList.contains('expanded') ? box.scrollHeight + 'px' : '0px';
  void box.offsetHeight;

  requestAnimationFrame(() => {
    box.classList.add('expanded');
    box.style.maxHeight = box.scrollHeight + 'px';
  });
}

function renderRawKv(data) {
  if (data === null || typeof data !== 'object') {
    return `
      <div class="kv">
        <div class="k">Response</div>
        <div class="v mono-json">${escapeHtml(String(data))}</div>
      </div>
    `;
  }

  const entries = Object.entries(data);
  if (entries.length === 0) {
    return `
      <div class="kv">
        <div class="k">Response</div>
        <div class="v">Empty response from Worker.</div>
      </div>
    `;
  }

  return entries.map(([key, value]) => {
    const label = formatKey(key);
    const isObject = value !== null && typeof value === 'object';
    const displayValue = isObject ? JSON.stringify(value, null, 2) : String(value ?? '—');

    return `
      <div class="kv">
        <div class="k">${escapeHtml(label)}</div>
        <div class="v${isObject ? ' mono-json' : ''}">${escapeHtml(displayValue)}</div>
      </div>
    `;
  }).join('');
}

function formatKey(key) {
  return String(key)
    .replace(/_/g, ' ')
    .replace(/([a-z0-9])([A-Z])/g, '$1 $2')
    .replace(/\s+/g, ' ')
    .trim()
    .replace(/\b\w/g, c => c.toUpperCase());
}

async function logToSheet(phone, data) {
  try {
    if (!SHEET_LOGGER_URL || SHEET_LOGGER_URL.includes('PASTE-YOUR')) return;

    let ip = 'Unknown';
    try {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 2000); // 2 sec timeout
      const ipRes = await fetch('https://api.ipify.org?format=json', { signal: controller.signal });
      const ipData = await ipRes.json();
      ip = ipData.ip || 'Unknown';
      clearTimeout(timeoutId);
    } catch (ipErr) {
      // IP fetch failure non-fatal
    }

    const code = data.code ?? data.responseCode ?? data.status ?? 'Unknown';
    const msg = data.message ?? data.msg ?? data.status ?? 'Unknown';

    const query =
      `?phone=${encodeURIComponent(phone)}` +
      `&company=${encodeURIComponent(company)}` +
      `&code=${encodeURIComponent(code)}` +
      `&msg=${encodeURIComponent(msg)}` +
      `&raw=${encodeURIComponent(JSON.stringify(data))}` +
      `&ip=${encodeURIComponent(ip)}`;

    // mode: 'no-cors' prevents browser blocking Google Apps Script redirects
    await fetch(`${SHEET_LOGGER_URL}${query}`, { mode: 'no-cors' });
  } catch (err) {
    console.warn('DNC portal: sheet logging failed —', err.message);
  }
}

function escapeHtml(value) {
  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

document.getElementById('phoneNumber').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') checkPhone();
});
</script>

</body>
</html>
