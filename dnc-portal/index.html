<!DOCTYPE html>
<html lang="en">
<head>
  <title>VTM DNC Portal</title>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <link rel="icon" type="image/png" href="logo.png">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css"/>
  <style>
    :root {
      --bg: #0b0f19;
      --card: #111827;
      --card2: #1f2937;
      --border: #374151;
      --txt: #f9fafb;
      --txt2: #9ca3af;
      --txt3: #6b7280;
      --teal: #1a9e75;
      --teal-glow: rgba(26,158,117,0.15);
      --teal-b: rgba(26,158,117,0.35);
      --green: #22c55e;
      --green-glow: rgba(34,197,94,0.12);
      --green-b: rgba(34,197,94,0.4);
      --red: #ef4444;
      --red-glow: rgba(239,68,68,0.12);
      --red-b: rgba(239,68,68,0.4);
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body { font-family:'DM Sans',sans-serif; background:var(--bg); color:var(--txt); min-height:100vh; display:flex;align-items:center;justify-content:center; padding:2rem 1rem; }
    .card { background:var(--card); border:0.5px solid var(--border); border-radius:16px; width:100%;max-width:560px; overflow:hidden; box-shadow:0 25px 30px -8px rgba(0,0,0,0.6); }
    .header { background:#090d16; padding:1.4rem 2rem; display:flex;align-items:center;gap:14px; border-bottom:0.5px solid var(--border); }
    .logo { width:40px;height:40px; background:var(--teal); border-radius:10px; display:flex;align-items:center;justify-content:center; flex-shrink:0; }
    .logo i{font-size:22px;color:#fff}
    .header-txt h1{font-size:16px;font-weight:600;color:#fff}
    .header-txt p{font-size:12px;color:var(--txt2);margin-top:2px}
    .company-badge { margin-left:auto; display:flex; align-items:center; gap:6px; background:var(--teal-glow); border:0.5px solid var(--teal-b); border-radius:20px; padding:4px 12px; font-size:12px; color:var(--teal); font-weight:500; flex-shrink:0; max-width:180px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .body{padding:2rem}
    .input-container { display:flex; gap:10px; margin-bottom:1.8rem; }
    input[type="tel"] { flex:1; padding:0.8rem 1.2rem; background-color:#090d16; border:0.5px solid var(--border); border-radius:10px; color:#fff; font-size:15px; }
    input[type="tel"]:focus { outline:none; border-color:var(--teal); }
    button.run-btn { padding:0.8rem 1.6rem; background-color:var(--teal); color:#fff; border:none; border-radius:10px; font-size:14px; font-weight:500; cursor:pointer; display:flex; align-items:center; gap:8px; }
    button.run-btn:hover { opacity:0.9; }
    button.run-btn:disabled { background-color:var(--card2); color:var(--txt3); cursor:not-allowed; }

    .result-box { display:none; border-radius:14px; border:0.5px solid var(--border); background:var(--card2); overflow:hidden; }
    .result-box.visible { display:block; }
    .result-box.loading { border-color:var(--teal-b); }
    .result-box.success { border-color:var(--green-b); }
    .result-box.error { border-color:var(--red-b); }

    .result-header { padding:1.1rem 1.4rem; display:flex; align-items:center; gap:10px; border-bottom:0.5px solid var(--border); }
    .result-header i { font-size:20px; }
    .result-header.loading i { color:var(--teal); animation:spin 0.8s linear infinite; }
    .result-header.success i { color:var(--green); }
    .result-header.error i { color:var(--red); }
    .result-title { font-size:15px; font-weight:600; }
    .result-phone { font-family:'DM Mono',monospace; font-size:13px; color:var(--txt2); margin-left:auto; }

    .kv-list { padding:0.6rem 0; }
    .kv-row { display:flex; padding:0.7rem 1.4rem; border-bottom:0.5px solid rgba(255,255,255,0.04); }
    .kv-row:last-child { border-bottom:none; }
    .kv-key { width:130px; flex-shrink:0; font-size:12px; font-weight:500; color:var(--txt3); text-transform:uppercase; letter-spacing:0.04em; }
    .kv-value { flex:1; font-size:14px; color:var(--txt); word-break:break-all; }
    .kv-value.mono { font-family:'DM Mono',monospace; font-size:13px; }
    .badge { display:inline-block; padding:2px 10px; border-radius:20px; font-size:12px; font-weight:600; }
    .badge.good { background:rgba(34,197,94,0.15); color:var(--green); }
    .badge.bad { background:rgba(239,68,68,0.15); color:var(--red); }

    @keyframes spin{to{transform:rotate(360deg)}}
    @media(max-width:480px){ .body{padding:1.25rem} .header{padding:1.25rem} .kv-key{width:100px} }
  </style>
</head>
<body>
<div class="card">
  <div class="header">
    <div class="logo"><i class="ti ti-shield-check"></i></div>
    <div class="header-txt">
      <h1>DNC Checker</h1>
      <p>Vocal Tech Marketing · Compliance Portal</p>
    </div>
    <div class="company-badge" id="companyBadge" style="display:none">
      <i class="ti ti-building"></i>
      <span id="companyBadgeText"></span>
    </div>
  </div>

  <div class="body">
    <div class="input-container">
      <input type="tel" id="phoneNumber" placeholder="Enter phone number..." autocomplete="off">
      <button id="runBtn" class="run-btn" onclick="executeLookup()">
        <i class="ti ti-search"></i> Check
      </button>
    </div>

    <div class="result-box" id="resultBox">
      <div class="result-header" id="resultHeader">
        <i class="ti ti-loader-2" id="resultIcon"></i>
        <span class="result-title" id="resultTitle">Looking up…</span>
        <span class="result-phone" id="resultPhone"></span>
      </div>
      <div class="kv-list" id="kvList"></div>
    </div>
  </div>
</div>

<script>
  // ── CONFIG ───────────────────────────────────────────────────
  // Replace with your Cloudflare Worker URL
  const PROXY_URL = 'http://dnc-portal.syedshayanabbasr15121472.workers.dev/';

  const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby8j6erDfX9E6j8Y03uv4JdLzLykAYY4dzvYJRj94QEl4LBBSR0uc2THu_sTXg97n5wIw/exec';

  const ALLOWED_COMPANIES = ['echolink', 'vtm'];

  // ── Access control ───────────────────────────────────────────
  const urlParams = new URLSearchParams(window.location.search);
  const companyParam = urlParams.get('company');
  const sanitizedCompany = companyParam ? companyParam.trim().toLowerCase() : '';

  if (!sanitizedCompany || !ALLOWED_COMPANIES.includes(sanitizedCompany)) {
    document.body.innerHTML = `
      <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:#0b0f19;font-family:'DM Sans',sans-serif;text-align:center;padding:2rem;">
        <div style="width:64px;height:64px;background:rgba(239,68,68,0.15);border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:1.5rem;">
          <i class="ti ti-lock" style="font-size:30px;color:#ef4444;"></i>
        </div>
        <h2 style="color:#f9fafb;font-size:20px;font-weight:600;margin-bottom:8px;">Access Restricted</h2>
        <p style="color:#6b7280;font-size:14px;max-width:320px;line-height:1.6;">
          This portal requires an authorized company link.<br>
          Please contact Vocal Tech Marketing to get your access link.
        </p>
      </div>`;
    throw new Error('Access blocked');
  }

  const COMPANY_NAME = companyParam.trim();
  document.getElementById('companyBadgeText').textContent = COMPANY_NAME;
  document.getElementById('companyBadge').style.display = 'flex';

  // ── Helpers ──────────────────────────────────────────────────
  function formatPhone(d) {
    d = d.replace(/\D/g, '');
    if (d.length === 10) return `(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}`;
    if (d.length === 11 && d[0] === '1') return `+1 (${d.slice(1,4)}) ${d.slice(4,7)}-${d.slice(7)}`;
    return d;
  }

  function renderRawResponse(data, phone) {
    const list = document.getElementById('kvList');
    list.innerHTML = '';

    const rows = [
      { key: 'Status', value: data.status || '—' },
      { key: 'Message', value: data.message || '—', badge: true },
      { key: 'Code', value: data.code || 'none', mono: true },
      { key: 'Phone', value: data.phone || phone, mono: true },
      { key: 'Wireless', value: data.wireless !== undefined ? data.wireless : '—' },
      { key: 'SID', value: data.sid || '—', mono: true },
    ];

    // Add carrier if present
    if (data.carrier && typeof data.carrier === 'object') {
      rows.push({ key: 'Carrier', value: data.carrier.name || JSON.stringify(data.carrier) });
      if (data.carrier.type) rows.push({ key: 'Type', value: data.carrier.type });
      if (data.carrier.state) rows.push({ key: 'State', value: data.carrier.state });
    }

    // Any extra fields
    const known = new Set(['status','message','code','phone','wireless','sid','carrier']);
    for (const [k, v] of Object.entries(data)) {
      if (!known.has(k)) {
        rows.push({ key: k, value: typeof v === 'object' ? JSON.stringify(v) : String(v), mono: true });
      }
    }

    rows.forEach(r => {
      const row = document.createElement('div');
      row.className = 'kv-row';

      let valueHtml = r.value;
      if (r.badge) {
        const isGood = String(r.value).toLowerCase() === 'good' || String(r.value).toLowerCase() === 'none';
        valueHtml = `<span class="badge ${isGood ? 'good' : 'bad'}">${r.value}</span>`;
      } else if (r.mono) {
        valueHtml = `<span class="mono">${r.value}</span>`;
      }

      row.innerHTML = `
        <div class="kv-key">${r.key}</div>
        <div class="kv-value">${valueHtml}</div>`;
      list.appendChild(row);
    });
  }

  // ── Main lookup ──────────────────────────────────────────────
  async function executeLookup() {
    const input = document.getElementById('phoneNumber');
    const btn = document.getElementById('runBtn');
    const box = document.getElementById('resultBox');
    const header = document.getElementById('resultHeader');
    const icon = document.getElementById('resultIcon');
    const title = document.getElementById('resultTitle');
    const phoneEl = document.getElementById('resultPhone');

    const phoneVal = input.value.trim();
    if (!phoneVal) return alert('Please enter a phone number.');

    const cleanNum = phoneVal.replace(/\D/g, '');
    if (cleanNum.length < 7 || cleanNum.length > 15) {
      alert('Invalid phone format.');
      return;
    }

    btn.disabled = true;
    box.className = 'result-box visible loading';
    header.className = 'result-header loading';
    icon.className = 'ti ti-loader-2';
    title.textContent = 'Looking up…';
    phoneEl.textContent = formatPhone(cleanNum);
    document.getElementById('kvList').innerHTML = '';

    let userIP = 'Unknown';
    try {
      const ipRes = await fetch('https://api.ipify.org?format=json');
      const ipData = await ipRes.json();
      userIP = ipData.ip || 'Unknown';
    } catch (e) {}

    try {
      // Call your Cloudflare Worker (API key is never in the browser)
      const response = await fetch(`${PROXY_URL}?phone=${cleanNum}`);
      if (!response.ok) throw new Error(`Proxy error (HTTP ${response.status})`);

      const data = await response.json();

      // Show raw response nicely
      box.className = 'result-box visible success';
      header.className = 'result-header success';
      icon.className = 'ti ti-circle-check';
      title.textContent = 'API Response';
      renderRawResponse(data, cleanNum);

      // Log to Google Sheet (same as before)
      const rawCode = (data.code || 'none').toLowerCase();
      const rawMsg = data.message || '';

      fetch(`${GOOGLE_SCRIPT_URL}?phone=${cleanNum}&company=${encodeURIComponent(COMPANY_NAME)}&ip=${encodeURIComponent(userIP)}&code=${encodeURIComponent(rawCode)}&msg=${encodeURIComponent(rawMsg)}&raw=${encodeURIComponent(JSON.stringify(data))}`, {
        method: 'GET',
        mode: 'no-cors'
      }).catch(() => {});

    } catch (err) {
      box.className = 'result-box visible error';
      header.className = 'result-header error';
      icon.className = 'ti ti-alert-triangle';
      title.textContent = 'Lookup Failed';
      document.getElementById('kvList').innerHTML = `
        <div class="kv-row">
          <div class="kv-key">Error</div>
          <div class="kv-value">${err.message}</div>
        </div>`;
    } finally {
      btn.disabled = false;
    }
  }
</script>
</body>
</html>
